name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }} for HEAD
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            target: node20-linux-x64
            binary: bafang-canable
            artifact_suffix: linux
          - os: windows-latest
            target: node20-win-x64
            binary: bafang-canable.exe
            artifact_suffix: windows

    steps:
      - name: Checkout HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create output directory
        shell: bash
        run: mkdir -p dist

      - name: Build executable
        run: npx --yes @yao-pkg/pkg@latest server.js --targets ${{ matrix.target }} --output dist/${{ matrix.binary }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bafang-canable-${{ github.sha }}-${{ matrix.artifact_suffix }}
          path: dist/${{ matrix.binary }}
          if-no-files-found: error

  release:
    name: Publish release for HEAD
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifacts for HEAD
        uses: actions/download-artifact@v4
        with:
          pattern: bafang-canable-${{ github.sha }}-*
          merge-multiple: true
          path: dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: master-${{ github.sha }}
          name: Release ${{ github.sha }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          overwrite_files: true
          files: |
            dist/*
